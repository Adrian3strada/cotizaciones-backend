# Configuración de Nixpacks para Railway
# https://nixpacks.com/docs/configuration

[phases.setup]
# "..." incluye los paquetes por defecto (Python, pip) para que funcionen
nixPkgs = ["...", "postgresql"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "gunicorn cotizaciones_project.wsgi:application"
