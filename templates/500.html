{% extends "base.html" %}
{% block title %}Error del servidor{% endblock %}
{% block breadcrumbs %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'quotes:dashboard' %}">Inicio</a></li>
        <li class="breadcrumb-item active">Error 500</li>
    </ol>
</nav>
{% endblock %}
{% block content %}
<div class="content-header">
    <div class="container-fluid">
        <h1 class="m-0">500</h1>
    </div>
</div>
<div class="card">
    <div class="card-body text-center py-5">
        <i class="fas fa-server fa-4x text-danger mb-3"></i>
        <h3>Error del servidor</h3>
        <p class="text-muted">Ocurrió un error inesperado. Por favor intenta más tarde.</p>
        <a href="{% url 'quotes:dashboard' %}" class="btn btn-primary">Ir al inicio</a>
    </div>
</div>
{% endblock %}
